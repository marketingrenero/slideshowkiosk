<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Re Nero Caffè – Slideshow Oriocenter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600&display=swap" rel="stylesheet">
<style>
  /* ===================== IMPOSTAZIONI GRAFICHE ===================== */
  :root{
    --sfondo: #3B4144;   /* colore di fondo (uguale al video) */
    --oro:    #CDBB8E;   /* colore del nome della pizza */
    --pizza:  min(80vw, 56vh);  /* grandezza della pizza */
  }
  /* ================================================================ */

  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:var(--sfondo);
    cursor:none;user-select:none;-webkit-user-select:none;}
  #scena{position:fixed;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;
    background:var(--sfondo);opacity:0;transition:opacity 1s ease;}
  #scena.pronta{opacity:1;}
  #logo{width:min(36vw,26vh);height:auto;margin-top:min(4.5vw,3vh);}
  #palco{position:relative;width:var(--pizza);height:var(--pizza);margin-top:min(3vw,2vh);}
  #palco canvas{position:absolute;top:0;left:0;width:100%;height:100%;opacity:0;
    transition:opacity var(--fade,1200ms) ease-in-out;will-change:opacity,transform;}
  #palco canvas.on{opacity:1;animation:respiro var(--durata,6000ms) ease-out forwards;}
  @keyframes respiro{
    from{transform:scale(.94) rotate(-7deg);}
    to  {transform:scale(1.02) rotate(0deg);}
  }
  #nome{margin-top:min(3vw,2vh);height:min(10vw,7vh);display:flex;align-items:center;justify-content:center;
    font-family:"Barlow",Arial,sans-serif;font-weight:500;text-transform:uppercase;color:var(--oro);
    font-size:min(6.6vw,4.7vh);letter-spacing:.14em;text-align:center;white-space:nowrap;
    transition:opacity 600ms ease, transform 600ms ease;}
  #nome.via{opacity:0;transform:translateY(12px);}
  #filetto{width:min(14vw,10vh);height:1px;margin-top:min(2vw,1.4vh);background:linear-gradient(90deg,transparent,var(--oro),transparent);opacity:.6;}
  #motto{width:min(73vw,52vh);height:auto;margin-top:min(3vw,2vh);}
  #riserva{position:fixed;top:0;left:0;width:100%;height:100%;object-fit:contain;object-position:center top;display:none;}
  #sorgente{position:fixed;width:2px;height:2px;opacity:0;pointer-events:none;}
</style>
</head>
<body>
<div id="scena">
  <canvas id="logo" width="390" height="140"></canvas>
  <div id="palco"></div>
  <div id="nome" class="via"></div>
  <div id="filetto"></div>
  <canvas id="motto" width="790" height="63"></canvas>
</div>
<video id="riserva" muted loop playsinline></video>
<video id="sorgente" muted playsinline preload="auto"></video>

<script>
/* ===================== IMPOSTAZIONI MODIFICABILI ===================== */
var CONFIG = {
  // Video da cui vengono prese le foto delle pizze
  video: "https://www.renero.it/images/slide/036.mp4",
  durata: 6000,        // quanto resta ogni pizza, in millisecondi
  dissolvenza: 1200,   // durata del passaggio tra una pizza e l'altra
  casuale: false,      // true = ordine casuale ad ogni giro
  // Pizze: nome da mostrare e secondo del video in cui compare
  pizze: [
    { nome: "Re Nero",                 t: 4.66 },
    { nome: "Margherita",              t: 4.18 },
    { nome: "Carrettiera",             t: 0.66 },
    { nome: "Caprese",                 t: 0.18 },
    { nome: "Pistacchio e Mortadella", t: 3.22 },
    { nome: "Bufalina",                t: 2.42 },
    { nome: "Fiocco",                  t: 2.10 },
    { nome: "Nerano",                  t: 2.74 },
    { nome: "Diavola",                 t: 7.06 },
    { nome: "Siciliana",               t: 1.62 },
    { nome: "Giàgiù",                  t: 7.54 },
    { nome: "Speck e Funghi",          t: 5.14 },
    { nome: "Cosacca",                 t: 1.14 },
    { nome: "Filetto",                 t: 3.70 },
    { nome: "Vesuvio",                 t: 6.10 },
    { nome: "Marinara",                t: 6.58 },
    { nome: "Würstel e Patatine",      t: 5.62 },
    { nome: "Nutella",                 t: 8.02 }
  ]
};
/* ==================================================================== */

(function(){
  var scena = document.getElementById('scena');
  var palco = document.getElementById('palco');
  var nome  = document.getElementById('nome');
  var src   = document.getElementById('sorgente');
  var root  = document.documentElement.style;
  root.setProperty('--fade', CONFIG.dissolvenza + 'ms');
  root.setProperty('--durata', (CONFIG.durata + CONFIG.dissolvenza) + 'ms');

  var LATO = 820, CROP_X = 115, CROP_Y = 90;    // zona della pizza nel video
  var tele = [], avviato = false;

  // Se qualcosa non va, mostra semplicemente il video originale in loop
  function riserva(){
    if (avviato) return; avviato = true;
    scena.style.display = 'none';
    var r = document.getElementById('riserva');
    r.src = CONFIG.video; r.style.display = 'block';
    r.play().catch(function(){});
  }
  var timerRiserva = setTimeout(riserva, 25000);

  function vaiA(t){
    return new Promise(function(ok){
      var fatto = false;
      function fine(){ if (!fatto){ fatto = true; src.removeEventListener('seeked', fine); setTimeout(ok, 60); } }
      src.addEventListener('seeked', fine);
      src.currentTime = t;
      setTimeout(fine, 3000);
    });
  }

  function ritaglia(cv, sx, sy, w, h){
    var g = cv.getContext('2d'), W = cv.width, H = cv.height;
    g.drawImage(src, sx, sy, w, h, 0, 0, W, H);
    // sfuma i bordi del ritaglio nel fondo
    g.globalCompositeOperation = 'destination-in';
    var o = g.createLinearGradient(0, 0, W, 0);
    o.addColorStop(0, 'rgba(0,0,0,0)'); o.addColorStop(0.10, 'rgba(0,0,0,1)');
    o.addColorStop(0.90, 'rgba(0,0,0,1)'); o.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = o; g.fillRect(0, 0, W, H);
    var v = g.createLinearGradient(0, 0, 0, H);
    v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(0.15, 'rgba(0,0,0,1)');
    v.addColorStop(0.85, 'rgba(0,0,0,1)'); v.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = v; g.fillRect(0, 0, W, H);
    g.globalCompositeOperation = 'source-over';
  }

  function preparaPizza(){
    var cv = document.createElement('canvas');
    cv.width = LATO; cv.height = LATO;
    var g = cv.getContext('2d');
    g.drawImage(src, CROP_X, CROP_Y, LATO, LATO, 0, 0, LATO, LATO);
    g.clearRect(0, 0, LATO, 155 - CROP_Y);   // toglie la scritta del logo presente nel video sopra la pizza
    // bordi sfumati in modo circolare, così il ritaglio non si vede
    g.globalCompositeOperation = 'destination-in';
    var rg = g.createRadialGradient(LATO/2, LATO/2, LATO*0.44, LATO/2, LATO/2, LATO*0.5);
    rg.addColorStop(0, 'rgba(0,0,0,1)');
    rg.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = rg; g.fillRect(0, 0, LATO, LATO);
    return cv;
  }

  async function prepara(){
    src.src = CONFIG.video;
    await new Promise(function(ok, ko){ src.onloadeddata = ok; src.onerror = ko; });
    // logo e scritta presi dal primo fotogramma
    await vaiA(CONFIG.pizze[0].t);
    ritaglia(document.getElementById('logo'), 340, 20, 390, 140);
    ritaglia(document.getElementById('motto'), 135, 982, 790, 63);
    for (var i = 0; i < CONFIG.pizze.length; i++){
      await vaiA(CONFIG.pizze[i].t);
      var cv = preparaPizza();
      palco.appendChild(cv);
      tele.push({ cv: cv, nome: CONFIG.pizze[i].nome });
    }
    src.removeAttribute('src'); src.load();
  }

  var ordine = [], pos = -1, attuale = null;
  function nuovoGiro(){
    ordine = tele.map(function(_, i){ return i; });
    if (CONFIG.casuale){
      for (var i = ordine.length - 1; i > 0; i--){ var j = Math.floor(Math.random()*(i+1)); var k = ordine[i]; ordine[i] = ordine[j]; ordine[j] = k; }
    }
    pos = -1;
  }

  function prossima(){
    if (++pos >= ordine.length) nuovoGiro(), pos = 0;
    var t = tele[ordine[pos]];
    if (attuale && attuale === t) return;
    if (attuale) attuale.cv.classList.remove('on');
    // riavvia l'animazione lenta
    t.cv.classList.remove('on'); void t.cv.offsetWidth; t.cv.classList.add('on');
    nome.classList.add('via');
    setTimeout(function(){ nome.textContent = t.nome; nome.classList.remove('via'); }, Math.min(600, CONFIG.dissolvenza/2));
    attuale = t;
  }

  prepara().then(function(){
    if (avviato || !tele.length) return;
    avviato = true; clearTimeout(timerRiserva);
    nuovoGiro();
    scena.classList.add('pronta');
    prossima();
    setInterval(prossima, CONFIG.durata);
  }).catch(riserva);

  document.addEventListener('contextmenu', function(e){ e.preventDefault(); });
})();
</script>
</body>
</html>
